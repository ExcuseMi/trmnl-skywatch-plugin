---
strategy: polling
no_screen_padding: 'yes'
dark_mode: 'yes'
static_data: ''
polling_verb: get
framework_version: 3.0.3
serverless_language: node
polling_url: 'https://trmnl.bettens.dev/skywatch?lat={{ trmnl.plugin_settings.custom_fields_values.lat | default: 51.5074 }}&lon={{ trmnl.plugin_settings.custom_fields_values.lon | default: -0.1278 }}&address={{ trmnl.plugin_settings.custom_fields_values.address | url_encode }}&show_ground={{ trmnl.plugin_settings.custom_fields_values.show_ground | url_encode }}&route_display={{ trmnl.plugin_settings.custom_fields_values.route_display | default: "codes" }}'
polling_headers: ''
polling_body: ''
id: 286469
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: author_info
  name: About SkyWatch
  field_type: author_bio
  description: |-
    Live aircraft radar within 50 nm (~90 km / 55 mi), updated every 15 minutes. <a href="https://github.com/ExcuseMi/trmnl-skywatch-plugin/blob/main/GUIDE.md" target="_blank">How to read the display →</a>
    <br /><br /><strong>Labels</strong><br /> Callsign · aircraft type · altitude · speed. Brightness reflects altitude. Emergency squawks flagged automatically.
    <br /><br /><strong>Routes</strong><br /> Origin → destination labels powered by <a href="https://www.adsbdb.com" target="_blank">adsbdb.com</a>. Progress bar shows position along the route.
    <br /><br /><strong>Airports</strong><br /> Large and medium airports marked with crosshair and IATA code. <a href="https://github.com/ExcuseMi/trmnl-skywatch-plugin/blob/main/AIRPORTS.md" target="_blank">Full airport list →</a> · <a href="https://github.com/ExcuseMi/trmnl-skywatch-plugin/blob/main/GUIDE.md" target="_blank">Display guide →</a>
    <br /><br /><strong>Data sources</strong><br /> ADS-B signals via <a href="https://airplanes.live" target="_blank">airplanes.live</a>, <a href="https://adsb.lol" target="_blank">adsb.lol</a> and <a href="https://adsb.fi" target="_blank">adsb.fi</a>· Airport data via <a href="https://ourairports.com" target="_blank">OurAirports</a> · Route data via <a href="https://www.adsbdb.com" target="_blank">adsbdb.com</a> · Icons by <a href="https://adsb-radar.com/" target="_blank">ADS-B Radar</a>
  github_url: https://github.com/ExcuseMi/trmnl-skywatch-plugin
  learn_more_url: https://github.com/ExcuseMi/trmnl-skywatch-plugin/blob/main/GUIDE.md
  category: travel,environment
  help_text: TRMNL X Ready
- keyname: address
  field_type: string
  name: Location / Address
  description: City or address to centre the radar on.<br />Takes priority over Latitude / Longitude if both are set.
  help_text: e.g. "London, UK" or "Central Park, NY"
  placeholder: London, UK
  group: Location
  optional: true
- keyname: lat
  field_type: string
  name: Latitude
  description: Centre latitude for the radar view.<br />Only used when no Address is set.<br />Find your coordinates at <a href="https://www.latlong.net" target="_blank">latlong.net</a>.
  help_text: e.g. 51.5074 (London) · 40.7128 (New York)
  placeholder: '51.5074'
  group: Location
  optional: true
- keyname: lon
  field_type: string
  name: Longitude
  description: Centre longitude for the radar view.<br />Only used when no Address is set.
  help_text: e.g. -0.1278 (London) · -74.0060 (New York)
  placeholder: "-0.1278"
  group: Location
  optional: true
- keyname: unit
  field_type: select
  name: Measurement Units
  description: Unit system for speed and altitude.<br />Metric — km/h and metres.<br />Imperial — knots and feet.
  options:
  - Metric (km/h, m): metric
  - Imperial (kt, ft): imperial
  default: imperial
  optional: true
- keyname: route_display
  field_type: select
  name: Route Label Style
  description: How to display flight origin → destination on aircraft labels.
  options:
  - Airport codes (AMS → LHR): codes
  - City names (AMSTERDAM (NL) → LONDON (GB)): cities
  - Hide route label: hidden
  default: codes
  optional: true
- keyname: show_ground
  field_type: boolean
  name: Show Ground Traffic
  description: Include aircraft currently on the ground, such as those taxiing or parked at airports.
  default: 'false'
  optional: true
- keyname: map_zoom
  field_type: select
  name: Map Zoom
  description: How far to zoom the map. Auto fits the view to the nearest aircraft automatically. Pick a fixed level to override.
  options:
  - Auto (recommended): auto
  - 8 (Wide): '8'
  - 9 (Medium): '9'
  - 10 (Medium): '10'
  - 11 (Close): '11'
  - 12 (Closest): '12'
  default: auto
  optional: true
- keyname: tile_style
  field_type: select
  name: Map Style
  description: <strong>Free (CartoDB)</strong> — no account needed. Light or dark follows your display setting.<br /><br /> <strong>Stamen styles</strong> — high-contrast monochrome tiles optimised for e-ink. A free <a href="https://client.stadiamaps.com/signup/" target="_blank">Stadia Maps</a> API key is required (free account, 200,000 tile credits/month included).
  help_text: <a href="https://docs.stadiamaps.com/themes/" target="_blank">Preview all map styles →</a>
  options:
  - 'Free: CartoDB Dark': cartodb_dark
  - 'Free: CartoDB Light': cartodb_light
  - 'Stamen: Toner (B&W)': stamen_toner
  - 'Stamen: Toner Lite': stamen_toner_lite
  - 'Stamen: Toner Dark': stamen_toner_dark
  - 'Stamen: Toner Blacklite': stamen_toner_blacklite
  - 'Stamen: Toner Background (no labels)': stamen_toner_background
  - 'Stamen: Terrain': stamen_terrain
  - 'Stamen: Watercolor': stamen_watercolor
  default: cartodb_dark
  optional: true
  conditional_validation:
  - when: cartodb_dark
    hidden:
    - stadia_api_key
  - when: cartodb_light
    hidden:
    - stadia_api_key
  - when: stamen_toner
    required:
    - stadia_api_key
  - when: stamen_toner_lite
    required:
    - stadia_api_key
  - when: stamen_toner_dark
    required:
    - stadia_api_key
  - when: stamen_toner_blacklite
    required:
    - stadia_api_key
  - when: stamen_toner_background
    required:
    - stadia_api_key
  - when: stamen_terrain
    required:
    - stadia_api_key
  - when: stamen_watercolor
    required:
    - stadia_api_key
- keyname: stadia_api_key
  field_type: password
  name: Stadia Maps API Key
  description: Required for Stamen styles.<br /><br />Free account — get your key at <a href="https://client.stadiamaps.com/signup/" target="_blank">stadiamaps.com</a><br />200,000 tile credits/month included.
  optional: true
name: SkyWatch
description: ''
refresh_interval: 15
